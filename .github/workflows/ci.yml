name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: ['services/api-gateway/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']
            identity-service: ['services/identity-service/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']
            catalog-service: ['services/catalog-service/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']
            order-service: ['services/order-service/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']
            payment-service: ['services/payment-service/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']
            shipping-simulator: ['services/shipping-simulator/**', 'pkg/**', 'contracts/**', 'go.work']
            analytics-service: ['services/analytics-service/**', 'pkg/**', 'proto/**', 'contracts/**', 'go.work']

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint, test and build the web app
        run: make web-test

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go build ./... && go test ./...
        working-directory: services/${{ matrix.service }}

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Test shared modules and repo scaffold
        run: |
          for d in pkg contracts proto/gen/go tests tools/olist-importer; do
            (cd "$d" && go build ./... && go test ./...) || exit 1
          done

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: buf lint
        run: make proto-lint
      - name: buf breaking
        run: make proto-breaking BUF_AGAINST="../.git#ref=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }},subdir=proto"
      - name: Generated code is up to date
        run: |
          make proto-generate
          git status --porcelain proto/gen
          test -z "$(git status --porcelain proto/gen)"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
      kafka:
        image: apache/kafka:4.3.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Migration, outbox and relay tests against Postgres and Kafka
        working-directory: pkg
        env:
          DBMIGRATE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
          OUTBOX_TEST_KAFKA: localhost:9092
        run: go test ./dbmigrate/... ./bootstrap/... ./app/... ./outbox/... ./eventbus/...
      - name: catalog repository tests against Postgres
        working-directory: services/catalog-service
        env:
          DBMIGRATE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test ./internal/repository/...
      - name: identity tests against Postgres
        working-directory: services/identity-service
        env:
          DBMIGRATE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test ./internal/repository/... ./cmd/server/...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the platform
        run: make up
      - name: Database isolation
        run: make check-db-isolation
      - name: Prometheus scrapes every service
        run: |
          for i in $(seq 20); do
            down=$(curl -s 127.0.0.1:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health != "up")] | length')
            [ "$down" = "0" ] && exit 0
            sleep 3
          done
          curl -s 127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | {scrapeUrl, health, lastError}'
          exit 1
      - name: order-service runs the outbox relay (outbox_unsent_rows is 0)
        run: |
          for i in $(seq 30); do
            v=$(curl -s '127.0.0.1:9090/api/v1/query?query=outbox_unsent_rows' | jq -r '.data.result[0].value[1] // empty')
            test "$v" = 0 && exit 0
            sleep 2
          done
          echo "outbox_unsent_rows never reported 0"; exit 1
      - name: Gateway reaches a service over traced gRPC
        run: curl -fsS 127.0.0.1:8080/debug/grpc-health/catalog-service
      - name: identity serves its JWKS inside the compose network
        run: |
          docker run --rm --network olist golang:1.27.3-alpine \
            wget -qO- http://identity-service:8080/.well-known/jwks.json \
            | jq -e '.keys | length == 1 and .[0].alg == "RS256"'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # TestLiveDemoAccounts needs `make import` (the Kaggle data is not in CI).
      - name: Register and log in against the running identity-service
        run: |
          (cd services/identity-service && CGO_ENABLED=0 GOOS=linux go test -c -o "$RUNNER_TEMP/identity.test" ./cmd/server/)
          docker create --name idlive --network olist \
            -e IDENTITY_LIVE_GRPC=identity-service:9090 -e IDENTITY_LIVE_HTTP=identity-service:8080 \
            golang:1.27.3-alpine /identity.test -test.run '^TestLiveRegisterAndLogin$' -test.v
          docker cp "$RUNNER_TEMP/identity.test" idlive:/identity.test
          docker start -a idlive
      - name: Gateway enforces roles (register a Customer, then hit each group)
        run: |
          tok=$(curl -fsS -X POST 127.0.0.1:8080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci-customer@example.com","password":"s3cret-pw"}' | jq -er .access_token)
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code 127.0.0.1:8080/api/checkout)" = 401
          test "$(code -H "Authorization: Bearer $tok" 127.0.0.1:8080/api/checkout)" = 404
          test "$(code -H "Authorization: Bearer $tok" 127.0.0.1:8080/api/seller/orders)" = 403
          test "$(code -H "Authorization: Bearer $tok" 127.0.0.1:8080/api/admin/vouchers)" = 403
      - name: Browsing is public (no dataset in CI, so only the Uncategorized row)
        run: |
          curl -fsS 127.0.0.1:8080/api/categories | jq -e '.categories | any(.name_pt == "Uncategorized")'
          curl -fsS '127.0.0.1:8080/api/products?category=Uncategorized' | jq -e '.total == 0 and .products == []'
          # page=0 is caught by the gateway; the other two by catalog-service.
          for q in page=0 page_size=101 category=nope; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "127.0.0.1:8080/api/products?$q")" = 400
          done
      - name: web serves the app and proxies /api/ to the gateway
        run: |
          curl -fsS 127.0.0.1:5173/ | grep -q '<title>Olist Marketplace</title>'
          curl -fsS 127.0.0.1:5173/seller/orders | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:5173/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"nobody@example.com","password":"x"}')" = 401
      - name: Importer image builds (tools profile is not built by make up)
        run: docker compose -f deployments/docker-compose.yml --profile tools build olist-importer
      - name: Logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --tail 100
      - name: Stop
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v
