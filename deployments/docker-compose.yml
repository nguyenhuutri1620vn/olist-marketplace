# Local runtime: every service plus infrastructure on one network (NFR-6).
# Only api-gateway and the observability UIs publish host ports, bound to
# localhost (AD-14); service ports and Postgres stay internal. The web container
# arrives in Story 1.7.

x-service: &service
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:-shipping}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: olist-marketplace-local-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    build: ./prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3000:3000"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8080"

  identity-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:-identity}@postgres:5432/identity?sslmode=disable

  catalog-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    environment:
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:-catalog}@postgres:5432/catalog?sslmode=disable

  order-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    environment:
      DATABASE_URL: postgres://order:${ORDER_DB_PASSWORD:-order}@postgres:5432/order?sslmode=disable

  payment-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    environment:
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:-payment}@postgres:5432/payment?sslmode=disable

  shipping-simulator:
    <<: *service
    build:
      context: ..
      dockerfile: services/shipping-simulator/Dockerfile
    environment:
      DATABASE_URL: postgres://shipping:${SHIPPING_DB_PASSWORD:-shipping}@postgres:5432/shipping?sslmode=disable

  analytics-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    environment:
      DATABASE_URL: postgres://analytics:${ANALYTICS_DB_PASSWORD:-analytics}@postgres:5432/analytics?sslmode=disable

networks:
  default:
    name: olist

volumes:
  pgdata:
  kafkadata:
