# Local runtime: every service plus infrastructure on one network (NFR-6).
# Only api-gateway, web and the observability UIs publish host ports, bound to
# localhost (AD-14); service ports and Postgres stay internal.

# Every service: traces to Jaeger over OTLP/HTTP, and the binary probes its
# own /readyz (distroless has no curl), so `make up --wait` means ready.
x-env: &env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-healthcheck: &healthcheck
  test: ["CMD", "/server", "healthcheck"]
  interval: 2s
  timeout: 5s
  retries: 30

x-service: &service
  restart: on-failure
  healthcheck: *healthcheck
  depends_on:
    postgres:
      condition: service_healthy

x-kafka-service: &kafka-service
  restart: on-failure
  healthcheck: *healthcheck
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:-shipping}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: olist-marketplace-local-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    build: ./prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build: ./grafana
    ports:
      - "127.0.0.1:3000:3000"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: on-failure
    healthcheck: *healthcheck
    # The gateway is only useful once the services it calls are ready.
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    environment:
      <<: *env
    ports:
      - "127.0.0.1:8080:8080"

  # The SPA: nginx serves it and proxies /api/ to the gateway (UX-DR1).
  web:
    build: ../web
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

  identity-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:-identity}@postgres:5432/identity?sslmode=disable

  catalog-service:
    <<: *service
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:-catalog}@postgres:5432/catalog?sslmode=disable

  order-service:
    <<: *kafka-service
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://order:${ORDER_DB_PASSWORD:-order}@postgres:5432/order?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CATALOG_ADDR: catalog-service:9090

  payment-service:
    <<: *kafka-service
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:-payment}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092

  shipping-simulator:
    <<: *kafka-service
    build:
      context: ..
      dockerfile: services/shipping-simulator/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://shipping:${SHIPPING_DB_PASSWORD:-shipping}@postgres:5432/shipping?sslmode=disable
      KAFKA_BROKERS: kafka:9092

  analytics-service:
    <<: *kafka-service
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    environment:
      <<: *env
      DATABASE_URL: postgres://analytics:${ANALYTICS_DB_PASSWORD:-analytics}@postgres:5432/analytics?sslmode=disable
      KAFKA_BROKERS: kafka:9092

  # On demand only (`make import`), never on `make up`: loads reference data
  # and demo Accounts through catalog's and identity's admin gRPC (AD-12). `make import` copies the CSVs in.
  olist-importer:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: tools/olist-importer/Dockerfile
    command: ["import"]
    environment:
      <<: *env
      DEMO_PASSWORD: ${DEMO_PASSWORD:-olist-demo-2026}
    depends_on:
      catalog-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy

  # On demand only (`make dlq-redrive TOPIC=…`, `make dlq-check`): inspects and
  # redrives <topic>.dlq dead-letter topics (AD-7).
  dlq-redrive:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: tools/dlq-redrive/Dockerfile
    environment:
      <<: *env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

networks:
  default:
    name: olist

volumes:
  pgdata:
  kafkadata:
