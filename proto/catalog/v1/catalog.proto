syntax = "proto3";

package catalog.v1;

option go_package = "github.com/nguyenhuutri1620vn/olist-marketplace/proto/gen/go/catalog/v1;catalogv1";

// CatalogService serves the catalog to browsing clients (FR13) and the
// Product snapshot order-service takes at Checkout (AD-15). Every RPC is
// public: catalog data needs no token (NFR7).
service CatalogService {
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProducts(GetProductsRequest) returns (GetProductsResponse);
}

message ListCategoriesRequest {}

// ListCategoriesResponse holds every Category, "Uncategorized" included.
message ListCategoriesResponse {
  repeated Category categories = 1;
}

// Category is keyed by its Portuguese dataset name; name_en is its label.
message Category {
  string name_pt = 1;
  string name_en = 2;
}

message ListProductsRequest {
  // Portuguese Category name; empty lists every Category.
  string category = 1;
  // 1-based.
  int32 page = 2;
  // 1 to 100.
  int32 page_size = 3;
}

// ListProductsResponse is one page sorted by display name, then product id.
message ListProductsResponse {
  repeated ProductSummary products = 1;
  // Number of Products matching the filter, across all pages.
  int64 total = 2;
}

message ProductSummary {
  // 32 hex digits, as in the dataset.
  string product_id = 1;
  string display_name = 2;
  string category_name_pt = 3;
  string category_name_en = 4;
  // 32 hex digits, as in the dataset.
  string seller_id = 5;
  string seller_city = 6;
  string seller_state = 7;
  int64 price_centavos = 8;
}

message GetProductsRequest {
  // 32 hex digits each; at most 100.
  repeated string product_ids = 1;
}

// GetProductsResponse holds the known Products; unknown ids are absent.
message GetProductsResponse {
  repeated ProductSnapshot products = 1;
}

// ProductSnapshot is what an Order Item copies at Checkout (AD-15).
message ProductSnapshot {
  string product_id = 1;
  string seller_id = 2;
  // Two-letter Brazilian state code of the Seller.
  string seller_state = 3;
  // English Category name; "Uncategorized" without a dataset Category.
  string category_name_en = 4;
  int64 price_centavos = 5;
  int64 freight_centavos = 6;
}
